# .github/workflows/news-bot.yml
#
# Free crypto news bot. No paid services.
# Repo secrets needed: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# (Settings > Secrets and variables > Actions)

name: crypto news bot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min. 5 min is the documented minimum.
  workflow_dispatch:          # manual trigger button, useful for testing

permissions:
  contents: write             # required to commit seen.json back

concurrency:
  group: news-bot             # never let two runs race on the state file
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests feedparser

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE: rss
          STATE_PATH: seen.json
        run: python crypto_news_bot.py

      - name: Persist state
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
